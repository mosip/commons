# Local profile for kernel-notification-service (run-local.sh / run-local.bat).
# Activate with: -Dspring.profiles.active=local
# No Git clone, no config-server, and no authmanager are required.
# SMS/email are proxied (not sent to a real gateway/SMTP).

server.port=8083
server.servlet.path=/v1/notifier
spring.mvc.servlet.path=/v1/notifier

# Boot 4 defaults to Jackson 3; MOSIP code autowires com.fasterxml.jackson.databind.ObjectMapper
spring.http.converters.preferred-json-mapper=jackson2

# SMTP placeholders (unused while mosip.kernel.mail.proxy-mail=true)
spring.mail.host=smtp.sendgrid.net
spring.mail.username=apikey
spring.mail.password=apikey
spring.mail.port=587
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.debug=false

# MULTIPART
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB

# Auth adapter (offline token validation for local)
auth.server.validate.url=http://localhost:8091/authmanager/authorize/validateToken
auth.role.prefix=ROLE_
auth.header.name=Authorization
mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
auth.server.admin.offline.token.validate=true
mosip.kernel.auth.appids.realm.map={regproc:'mosip'}
spring.security.method-security.enabled=false
# Boot 4 PathPattern rejects MOSIP /**/actuator/** (middle **). Local: permit all without extra SecurityConfig.
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
mosip.global.end-points=/**
mosip.service.end-points=/**

mosip.kernel.sms.enabled=true
mosip.kernel.sms.country.code=91
mosip.kernel.sms.number.length=10
mosip.kernel.sms.number.min.length=8
mosip.kernel.sms.number.max.length=16
mosip.id.validation.identity.phone=^([6-9]{1})([0-9]{9})$

# msg91 placeholders (unused while mosip.kernel.sms.proxy-sms=true)
mosip.kernel.sms.api=http://api.msg91.com/api/v2/sendsms
mosip.kernel.sms.authkey=local-placeholder
mosip.kernel.sms.route=4
mosip.kernel.sms.sender=MOSMSG

mosip.kernel.sms.proxy-sms=true
mosip.kernel.email.proxy-email=true
mosip.kernel.mail.proxy-mail=true

mosip.role.kernel.postemailsend=ZONAL_ADMIN,PRE_REGISTRATION_ADMIN,AUTH,ID_AUTHENTICATION,RESIDENT,REGISTRATION_ADMIN,REGISTRATION_OFFICER,REGISTRATION_PROCESSOR,REGISTRATION_SUPERVISOR,INDIVIDUAL
mosip.role.kernel.postsmssend=PRE_REGISTRATION_ADMIN,AUTH,ID_AUTHENTICATION,RESIDENT,REGISTRATION_ADMIN,REGISTRATION_OFFICER,REGISTRATION_PROCESSOR,REGISTRATION_SUPERVISOR,INDIVIDUAL

# Boot 4 local run (no config-server, no Micrometer tracing)
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
spring.sleuth.enabled=false
management.health.mail.enabled=false
management.health.config.enabled=false
