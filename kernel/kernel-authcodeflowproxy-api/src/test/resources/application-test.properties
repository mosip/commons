#----------------------- Crypto --------------------------------------------------
spring.application.name=kernel-authcodeflowproxy-api
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:
#Crypto asymmetric algorithm name
mosip.kernel.crypto.asymmetric-algorithm-name=RSA/ECB/OAEPWITHSHA-256ANDMGF1PADDING
#Crypto symmetric algorithm name
mosip.kernel.crypto.symmetric-algorithm-name=AES/GCM/PKCS5Padding
#Keygenerator asymmetric algorithm name
mosip.kernel.keygenerator.asymmetric-algorithm-name=RSA
#Keygenerator symmetric algorithm name
mosip.kernel.keygenerator.symmetric-algorithm-name=AES
#Asymmetric algorithm key length
mosip.kernel.keygenerator.asymmetric-key-length=2048
#Symmetric algorithm key length
mosip.kernel.keygenerator.symmetric-key-length=256
#Keygenerator symmetric algorithm name
mosip.kernel.keygenerator.symmetric-algorithm-name=AES
# keygenerator asymmetric algorithm name
mosip.kernel.keygenerator.asymmetric-algorithm-name=RSA

#GCM tag length
mosip.kernel.crypto.gcm-tag-length=128
#Hash algo name
mosip.kernel.crypto.hash-algorithm-name=PBKDF2WithHmacSHA512
#Symmtric key length used in hash
mosip.kernel.crypto.hash-symmetric-key-length=256
#No of iterations in hash
mosip.kernel.crypto.hash-iteration=100000
#Sign algo name
mosip.kernel.crypto.sign-algorithm-name=RS256




auth.server.admin.validate.url=http://localhost:8081/v1/authmanager/authorize/admin/validateToken
mosip.iam.module.clientID=mosip-admin-client
mosip.iam.module.clientsecret=abc123
mosip.iam.module.redirecturi=http://localhost:8082/v1/admin/login-redirect/	
mosip.iam.module.admin_realm_id=mosip	
mosip.iam.base-url=http://localhost:8080/keycloak	
mosip.iam.authorization_endpoint=${mosip.iam.base-url}/auth/realms/{realmId}/protocol/openid-connect/auth
mosip.iam.token_endpoint=${mosip.iam.base-url}/auth/realms/{realmId}/protocol/openid-connect/token
auth.allowed.urls=http://localhost:5000/,http://localhost:5000/some-ui/**
mosip.iam.post-logout-uri-param-key=post_logout_redirect_uri	
mosip.iam.end-session-endpoint-path=/protocol/openid-connect/logout
auth.server.admin.issuer.domain.validate=false
auth.server.admin.audience.claim.validate=false

mosip.iam.certs_endpoint=http://localhost:5000/keycloak/auth/realms/mosip/protocol/openid-connect/certs

auth.server.admin.allowed.audience=myapp-client
mosip.iam.module.login_flow.claims=claims

mosip.client.assertion.reference.id=
mosip.include.payload=true
mosip.include.certificate=true
mosip.include.cert.hash=false
mosip.kernel.keymanager.url=http://localhost:keymanager
mosip.keymanager.jwt.sign.end.point=${mosip.kernel.keymanager.url}/v1/keymanager/jwtSign
mosip.iam.module.token.endpoint.private-key-jwt.expiry.seconds=60
mosip.resident.idp.client.id=mosip-resident-idp-client

spring.autoconfigure.exclude=\
io.mosip.kernel.idgenerator.vid.impl.VidGeneratorImpl,\
io.mosip.kernel.idgenerator.vid.util.VidFilterUtils,\
io.mosip.kernel.idgenerator.tokenid.impl.TokenIdGeneratorImpl,\
io.mosip.kernel.idgenerator.machineid.impl.MachineIdGeneratorImpl,\
io.mosip.kernel.idgenerator.regcenterid.impl.RegistrationCenterIdGeneratorImpl,\
io.mosip.kernel.idgenerator.mispid.impl.MispIdGeneratorImpl,\
io.mosip.kernel.licensekeygenerator.misp.impl.MISPLicenseKeyGeneratorImpl,\
io.mosip.kernel.licensekeygenerator.misp.util.MISPLicenseKeyGeneratorUtil,\
io.mosip.kernel.idgenerator.rid.impl.RidGeneratorImpl,\
io.mosip.kernel.idvalidator.prid.impl.PridValidatorImpl,\
io.mosip.kernel.idvalidator.rid.impl.RidValidatorImpl,\
io.mosip.kernel.idvalidator.uin.impl.UinValidatorImpl,\
io.mosip.kernel.idvalidator.vid.impl.VidValidatorImpl,\
io.mosip.kernel.idvalidator.mispid.impl.MispIdValidatorImpl,\
io.mosip.kernel.templatemanager.velocity.builder.TemplateManagerBuilderImpl,\
io.mosip.kernel.pdfgenerator.impl.PDFGeneratorImpl,\
io.mosip.kernel.qrcode.generator.zxing.QrcodeGeneratorImpl,\
io.mosip.kernel.transliteration.icu4j.impl.TransliterationImpl,\
io.mosip.kernel.applicanttype.api.impl.ApplicantTypeImpl,\
io.mosip.kernel.idobjectvalidator.config.IdObjectValidatorConfig,\
io.mosip.kernel.websub.api.config.IntentVerificationConfig,\
io.mosip.kernel.websub.api.config.WebSubClientConfig,\
io.mosip.kernel.websub.api.config.publisher.WebSubPublisherClientConfig,\
io.mosip.kernel.websub.api.config.publisher.RestTemplateHelper


