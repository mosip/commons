# Local profile for kernel-config-server (run-local.sh / run-local.bat).
# Activate with: -Dspring.profiles.active=local,native
# Native backend reads this classpath; no Git clone required.

server.port=51000
server.servlet.path=/config
server.servlet.context-path=/config

spring.cloud.config.server.accept-empty=true
spring.cloud.config.server.git.force-pull=false
spring.cloud.config.server.git.cloneOnStart=false
spring.cloud.config.server.git.refreshRate=0
spring.cloud.config.server.native.search-locations=classpath:/

# Served at http://localhost:51000/config/application/local
mosip.kernel.config-server.local=true
